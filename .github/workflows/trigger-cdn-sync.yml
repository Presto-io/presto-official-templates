name: Trigger Registry Refresh And CDN Sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to sync (e.g. v1.1.1)'
        required: true
        type: string

jobs:
  refresh-registry-and-sync-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh template-registry
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          TARGET_REPO="Presto-io/template-registry"
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EVENT_TYPE="official-release-published"

          echo "🔄 Triggering ${TARGET_REPO} repository_dispatch for ${RELEASE_TAG}"
          gh api "repos/${TARGET_REPO}/dispatches" \
            -f event_type="${EVENT_TYPE}" \
            -f "client_payload[force_rebuild]=true" \
            -f "client_payload[version]=${RELEASE_TAG}"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list \
              -R "${TARGET_REPO}" \
              --workflow "update-registry.yml" \
              --event repository_dispatch \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | "\(.databaseId)\t\(.createdAt)"' \
              | awk -v start="${START_TIME}" '$2 >= start { print $1; exit }' \
              | head -n 1)"

            if [ -n "${RUN_ID}" ]; then
              break
            fi

            echo "  waiting for template-registry workflow to appear (${attempt}/30)..."
            sleep 10
          done

          if [ -z "${RUN_ID}" ]; then
            echo "❌ Could not find the triggered template-registry workflow run"
            exit 1
          fi

          echo "⏳ Waiting for template-registry run ${RUN_ID}"
          gh run watch "${RUN_ID}" -R "${TARGET_REPO}" --exit-status

          echo "✅ template-registry refreshed for ${RELEASE_TAG}"

      - name: Trigger registry-deploy workflow
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          gh api repos/Presto-io/registry-deploy/dispatches \
            -f event_type=release-published \
            -f "client_payload[version]=${RELEASE_TAG}"

          echo "✅ Triggered CDN sync for ${RELEASE_TAG}"
