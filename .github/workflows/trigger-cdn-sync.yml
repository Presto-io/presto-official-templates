name: Trigger Registry Refresh And CDN Sync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      template:
        description: "Template name to sync (e.g. gongwen)"
        required: true
        type: string
      version:
        description: "Template version to sync (e.g. 1.2.1 or v1.2.1)"
        required: true
        type: string

jobs:
  refresh-registry-and-sync-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Parse template release
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_TEMPLATE: ${{ inputs.template }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${RELEASE_TAG}" ]; then
            TAG="${RELEASE_TAG}"
            if [ "${RELEASE_PRERELEASE}" = "true" ]; then
              echo "Skipping prerelease template registry refresh: ${TAG}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ ! "${TAG}" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
              echo "Ignoring non-template release tag: ${TAG}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TEMPLATE="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[3]}"
          else
            TEMPLATE="${INPUT_TEMPLATE}"
            VERSION="${INPUT_VERSION#v}"
            TAG="${TEMPLATE}-v${VERSION}"
          fi

          {
            echo "skip=false"
            echo "template=${TEMPLATE}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh template-registry
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          TARGET_REPO="Presto-io/template-registry"
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EVENT_TYPE="official-release-published"

          echo "Triggering ${TARGET_REPO} repository_dispatch for ${TEMPLATE} ${RELEASE_TAG}"
          gh api "repos/${TARGET_REPO}/dispatches" \
            -f event_type="${EVENT_TYPE}" \
            -f "client_payload[force_rebuild]=false" \
            -f "client_payload[template]=${TEMPLATE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=${RELEASE_TAG}"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list \
              -R "${TARGET_REPO}" \
              --workflow "update-registry.yml" \
              --event repository_dispatch \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | "\(.databaseId)\t\(.createdAt)"' \
              | awk -v start="${START_TIME}" '$2 >= start { print $1; exit }' \
              | head -n 1)"

            if [ -n "${RUN_ID}" ]; then
              break
            fi

            echo "  waiting for template-registry workflow to appear (${attempt}/30)..."
            sleep 10
          done

          if [ -z "${RUN_ID}" ]; then
            echo "Could not find the triggered template-registry workflow run" >&2
            exit 1
          fi

          echo "Waiting for template-registry run ${RUN_ID}"
          gh run watch "${RUN_ID}" -R "${TARGET_REPO}" --exit-status

      - name: Trigger registry-deploy workflow
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api repos/Presto-io/registry-deploy/dispatches \
            -f event_type=release-published \
            -f "client_payload[template]=${TEMPLATE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=${RELEASE_TAG}"

          echo "Triggered CDN sync for ${TEMPLATE} ${RELEASE_TAG}"

      - name: Trigger documentation sync workflow
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TEMPLATE: ${{ steps.release.outputs.template }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api repos/Presto-io/Presto-doc/dispatches \
            -f event_type=official-template-updated \
            -f "client_payload[template]=${TEMPLATE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=${RELEASE_TAG}"

          echo "Triggered documentation sync for ${TEMPLATE} ${RELEASE_TAG}"
