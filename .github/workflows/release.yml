name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  changes:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.detect.outputs.templates }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Detect changed templates
        id: detect
        shell: bash
        run: |
          ALL_TEMPLATES='["gongwen","jiaoan-shicao"]'

          # Find previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            echo "First release, building all templates"
            echo "templates=$ALL_TEMPLATES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $PREV_TAG..HEAD"
          CHANGED=$(git diff --name-only "$PREV_TAG"..HEAD)
          echo "$CHANGED"

          # Shared files changed → rebuild all
          if echo "$CHANGED" | grep -qE '^(go\.(mod|sum)|\.github/|internal/)'; then
            echo "Shared files changed, building all templates"
            echo "templates=$ALL_TEMPLATES" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Detect which template dirs have changes
          TEMPLATES=()
          for dir in gongwen jiaoan-shicao; do
            if echo "$CHANGED" | grep -q "^${dir}/"; then
              TEMPLATES+=("\"$dir\"")
            fi
          done

          if [ ${#TEMPLATES[@]} -eq 0 ]; then
            echo "No template changes detected, building all as fallback"
            echo "templates=$ALL_TEMPLATES" >> "$GITHUB_OUTPUT"
          else
            RESULT="[$(IFS=,; echo "${TEMPLATES[*]}")]"
            echo "Building changed templates: $RESULT"
            echo "templates=$RESULT" >> "$GITHUB_OUTPUT"
          fi

  build:
    permissions:
      contents: write
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: ${{ fromJson(needs.changes.outputs.templates) }}
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          cd ${{ matrix.template }}
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "../presto-template-${{ matrix.template }}-${{ matrix.os }}-${{ matrix.arch }}${EXT}" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: presto-template-${{ matrix.template }}-${{ matrix.os }}-${{ matrix.arch }}
          path: presto-template-*

  release:
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum presto-template-* > SHA256SUMS

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: |
            presto-template-*
            SHA256SUMS
          generate_release_notes: true

  refresh-registry-and-sync-cdn:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Refresh template-registry
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TARGET_REPO="Presto-io/template-registry"
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EVENT_TYPE="official-release-published"

          echo "🔄 Triggering ${TARGET_REPO} repository_dispatch for ${RELEASE_TAG}"
          gh api "repos/${TARGET_REPO}/dispatches" \
            -f event_type="${EVENT_TYPE}" \
            -f "client_payload[force_rebuild]=true" \
            -f "client_payload[version]=${RELEASE_TAG}"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list \
              -R "${TARGET_REPO}" \
              --workflow "update-registry.yml" \
              --event repository_dispatch \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | "\(.databaseId)\t\(.createdAt)"' \
              | awk -v start="${START_TIME}" '$2 >= start { print $1; exit }' \
              | head -n 1)"

            if [ -n "${RUN_ID}" ]; then
              break
            fi

            echo "  waiting for template-registry workflow to appear (${attempt}/30)..."
            sleep 10
          done

          if [ -z "${RUN_ID}" ]; then
            echo "❌ Could not find the triggered template-registry workflow run"
            exit 1
          fi

          echo "⏳ Waiting for template-registry run ${RUN_ID}"
          gh run watch "${RUN_ID}" -R "${TARGET_REPO}" --exit-status

          echo "✅ template-registry refreshed for ${RELEASE_TAG}"

      - name: Trigger registry-deploy workflow
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh api repos/Presto-io/registry-deploy/dispatches \
            -f event_type=release-published \
            -f "client_payload[version]=${RELEASE_TAG}"

          echo "✅ Triggered CDN sync for ${RELEASE_TAG}"
