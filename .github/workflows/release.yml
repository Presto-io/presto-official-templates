name: Release Template

on:
  push:
    tags: ['*-v*']

permissions: {}

jobs:
  metadata:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.parse.outputs.template }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      allow_unsigned_windows: ${{ steps.parse.outputs.allow_unsigned_windows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parse template release tag
        id: parse
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${TAG}" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid template release tag: ${TAG}" >&2
            echo "Expected format: {template}-v{semver}, for example gongwen-v1.2.3" >&2
            exit 1
          fi

          TEMPLATE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[3]}"
          IS_PRERELEASE=false
          ALLOW_UNSIGNED_WINDOWS=false

          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          if [[ "${VERSION}" == *"-beta"* ]]; then
            ALLOW_UNSIGNED_WINDOWS=true
          fi

          if [ ! -f "${TEMPLATE}/manifest.json" ]; then
            echo "Template manifest not found: ${TEMPLATE}/manifest.json" >&2
            exit 1
          fi

          MANIFEST_NAME="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["name"])' "${TEMPLATE}/manifest.json")"
          MANIFEST_VERSION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "${TEMPLATE}/manifest.json")"

          if [ "${MANIFEST_NAME}" != "${TEMPLATE}" ]; then
            echo "Manifest name ${MANIFEST_NAME} does not match tag template ${TEMPLATE}" >&2
            exit 1
          fi

          if [ "${MANIFEST_VERSION}" != "${VERSION}" ]; then
            echo "Manifest version ${MANIFEST_VERSION} does not match tag version ${VERSION}" >&2
            exit 1
          fi

          {
            echo "template=${TEMPLATE}"
            echo "version=${VERSION}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "allow_unsigned_windows=${ALLOW_UNSIGNED_WINDOWS}"
          } >> "$GITHUB_OUTPUT"

  signpath-preflight:
    permissions:
      contents: read
    needs: metadata
    runs-on: ubuntu-latest
    env:
      # Temporarily disabled while SignPath certificate checks are paused.
      # SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      # SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      # SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      # SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      # SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
      # SIGNPATH_EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_EXPECTED_PUBLISHER }}
      ALLOW_UNSIGNED_WINDOWS: ${{ needs.metadata.outputs.allow_unsigned_windows }}
    steps:
      - name: Temporarily bypass SignPath certificate preflight
        shell: bash
        run: |
          {
            echo "## SignPath certificate preflight temporarily disabled"
            echo
            echo "Release tag: \`${GITHUB_REF_NAME}\`"
            echo "Template: \`${{ needs.metadata.outputs.template }}\`"
            echo
            echo "CI is continuing without requiring SignPath certificate configuration."
          } >> "$GITHUB_STEP_SUMMARY"

