  validate:
    permissions:
      contents: read
    needs: [metadata, signpath-preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

      - name: Validate selected template
        shell: bash
        env:
          TEMPLATE: ${{ needs.metadata.outputs.template }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GO_STDLIB_DENY: '^net$|^net/|^os/exec$|^plugin$|^debug/'
        run: |
          cd "${TEMPLATE}"
          go build -trimpath -ldflags="-s -w" -o "../presto-template-${TEMPLATE}" .
          cd ..

          "./presto-template-${TEMPLATE}" --manifest | python3 -m json.tool > /dev/null
          "./presto-template-${TEMPLATE}" --example | "./presto-template-${TEMPLATE}" > /dev/null
          ACTUAL_VERSION="$("./presto-template-${TEMPLATE}" --version)"
          test "${ACTUAL_VERSION}" = "${VERSION}"

          FORBIDDEN="$(cd "${TEMPLATE}" && go list -f '{{join .Imports "\n"}}' ./... | grep -E "${GO_STDLIB_DENY}" || true)"
          if [ -n "${FORBIDDEN}" ]; then
            echo "SECURITY FAIL: ${TEMPLATE} imports forbidden packages: ${FORBIDDEN}" >&2
            exit 1
          fi

          if unshare --net true 2>/dev/null; then
            echo "# Test" | unshare --net "./presto-template-${TEMPLATE}" > /dev/null
          else
            echo "SKIP: no network sandbox tool available"
          fi

          OUTPUT="$("./presto-template-${TEMPLATE}" --example | "./presto-template-${TEMPLATE}")"
          if echo "${OUTPUT}" | grep -qiE '<html|<script|<iframe|<img|<link|<!DOCTYPE'; then
            echo "SECURITY FAIL: ${TEMPLATE} output contains HTML" >&2
            exit 1
          fi
          if ! echo "${OUTPUT}" | head -1 | grep -q '^[#/]'; then
            echo "SECURITY FAIL: ${TEMPLATE} output first line is not a Typst directive" >&2
            exit 1
          fi

  build:
    permissions:
      contents: read
    needs: [metadata, signpath-preflight, validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          TEMPLATE: ${{ needs.metadata.outputs.template }}
        run: |
          cd "${TEMPLATE}"
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "../presto-template-${TEMPLATE}-${GOOS}-${GOARCH}${EXT}" .

      - name: Verify embedded manifest version
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        env:
          TEMPLATE: ${{ needs.metadata.outputs.template }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          BINARY="./presto-template-${TEMPLATE}-${TARGET_OS}-${TARGET_ARCH}"
          ACTUAL="$("${BINARY}" --version)"
          test "${ACTUAL}" = "${VERSION}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: presto-template-${{ needs.metadata.outputs.template }}-${{ matrix.os }}-${{ matrix.arch }}
          path: presto-template-*

  sign-windows:
    permissions:
      actions: read
      contents: read
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Capture unsigned release asset hashes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(presto-template-*-windows-*.exe)
          if [ "${#windows[@]}" -eq 0 ]; then
            echo "public trusted signing blocked: no Windows .exe assets were built" >&2
            exit 1
          fi

          printf '%s\n' "${windows[@]}" | sort > unsigned-windows-files.txt
          sha256sum "${windows[@]}" | sort -k2 > unsigned-windows.sha256

      # - name: Upload unsigned Windows assets for SignPath
