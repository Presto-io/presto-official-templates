      - name: Record unsigned Windows assets while SignPath is disabled
        shell: bash
        run: |
          {
            echo "## SignPath signing temporarily disabled"
            echo
            echo "Release tag: \`${GITHUB_REF_NAME}\`"
            echo "Template: \`${{ needs.metadata.outputs.template }}\`"
            echo
            echo "Windows .exe assets are being uploaded unsigned while SignPath certificate checks are paused."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record unsigned beta Windows assets
        if: needs.metadata.outputs.allow_unsigned_windows == 'true'
        shell: bash
        run: |
          {
            echo "## unsigned Windows beta assets"
            echo
            echo "Release tag: \`${GITHUB_REF_NAME}\`"
            echo "Template: \`${{ needs.metadata.outputs.template }}\`"
            echo
            echo "Windows .exe assets are intentionally unsigned for this beta release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-assets
          path: |
            presto-template-*
            *-windows.sha256
          if-no-files-found: error
          retention-days: 1

  verify-windows-signatures:
