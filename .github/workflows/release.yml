      - name: Temporarily skip Authenticode verification
        shell: pwsh
        run: |
          "SignPath certificate verification is temporarily disabled for this workflow run." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Skip Authenticode verification for beta
        if: needs.metadata.outputs.allow_unsigned_windows == 'true'
        shell: pwsh
        run: |
          "Beta release: skipping Authenticode verification for unsigned Windows assets." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  release:
    permissions:
      contents: write
    needs: [metadata, sign-windows, verify-windows-signatures]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-assets

      - name: Generate checksums
        run: sha256sum presto-template-* > SHA256SUMS

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          name: presto-template-${{ needs.metadata.outputs.template }} v${{ needs.metadata.outputs.version }}
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          files: |
            presto-template-*
            SHA256SUMS
          generate_release_notes: true

  refresh-registry-and-sync-cdn:
    needs: [metadata, release]
    runs-on: ubuntu-latest
    steps:
      - name: Refresh template-registry
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.ref_name }}
          TEMPLATE: ${{ needs.metadata.outputs.template }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REGISTRY_CHANNEL: ${{ needs.metadata.outputs.is_prerelease == 'true' && 'prerelease' || 'production' }}
          ALLOW_PRERELEASE: ${{ needs.metadata.outputs.is_prerelease == 'true' && 'true' || 'false' }}
        run: |
          TARGET_REPO="Presto-io/template-registry"
          START_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          EVENT_TYPE="official-release-published"

          echo "Triggering ${TARGET_REPO} repository_dispatch for ${TEMPLATE} ${RELEASE_TAG} (${REGISTRY_CHANNEL})"
          gh api "repos/${TARGET_REPO}/dispatches" \
            -f event_type="${EVENT_TYPE}" \
            -f "client_payload[force_rebuild]=false" \
            -f "client_payload[template]=${TEMPLATE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -f "client_payload[channel]=${REGISTRY_CHANNEL}" \
            -f "client_payload[allow_prerelease]=${ALLOW_PRERELEASE}"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh run list \
              -R "${TARGET_REPO}" \
              --workflow "update-registry.yml" \
              --event repository_dispatch \
              --limit 20 \
              --json databaseId,createdAt \
              --jq '.[] | "\(.databaseId)\t\(.createdAt)"' \
              | awk -v start="${START_TIME}" '$2 >= start { print $1; exit }' \
              | head -n 1)"

            if [ -n "${RUN_ID}" ]; then
              break
            fi

            echo "  waiting for template-registry workflow to appear (${attempt}/30)..."
            sleep 10
          done

          if [ -z "${RUN_ID}" ]; then
            echo "Could not find the triggered template-registry workflow run" >&2
            exit 1
          fi

          echo "Waiting for template-registry run ${RUN_ID}"
          gh run watch "${RUN_ID}" -R "${TARGET_REPO}" --exit-status

      - name: Trigger registry-deploy workflow
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.ref_name }}
          TEMPLATE: ${{ needs.metadata.outputs.template }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REGISTRY_CHANNEL: ${{ needs.metadata.outputs.is_prerelease == 'true' && 'prerelease' || 'production' }}
        run: |
          gh api repos/Presto-io/registry-deploy/dispatches \
            -f event_type=release-published \
            -f "client_payload[template]=${TEMPLATE}" \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[tag]=${RELEASE_TAG}" \
            -f "client_payload[channel]=${REGISTRY_CHANNEL}"

          echo "Triggered CDN sync for ${TEMPLATE} ${RELEASE_TAG} (${REGISTRY_CHANNEL})"

      - name: Trigger Presto-doc template guide sync
        env:
          GH_TOKEN: ${{ secrets.PRESTO_PAT }}
          RELEASE_TAG: ${{ github.ref_name }}
          TEMPLATE: ${{ needs.metadata.outputs.template }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          if ! gh api repos/Presto-io/Presto-doc/dispatches \
              -f event_type=official-template-updated \
              -f "client_payload[template]=${TEMPLATE}" \
              -f "client_payload[version]=${VERSION}" \
              -f "client_payload[tag]=${RELEASE_TAG}"; then
            echo "::warning::Could not trigger Presto-doc guide sync. Check PRESTO_PAT access to Presto-io/Presto-doc; the docs repository also runs scheduled self-sync as a fallback."
            exit 0
          fi

          echo "Triggered Presto-doc guide sync for ${TEMPLATE} ${RELEASE_TAG}"
